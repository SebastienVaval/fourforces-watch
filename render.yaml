# Render Blueprint: New > Blueprint > point at this repo. Set XAI_API_KEY in the dashboard.
services:
  - type: web
    name: fourforces-watch
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CITY
        value: miami
      - key: DEMO_MODE
        value: "1"
      - key: XAI_VISION_MODEL
        value: grok-4.7
      - key: XAI_TEXT_MODEL
        value: grok-4.20-0309-non-reasoning
      - key: XAI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: AIRNOW_API_KEY
        sync: false
      - key: PURPLEAIR_API_KEY
        sync: false
