# City pack: Miami-Dade County, Florida
id: miami
name: Miami-Dade County, FL
timezone: America/New_York
center: [25.77, -80.25]
zoom: 10
bbox: {south: 25.13, north: 25.98, west: -80.87, east: -80.11}

water:
  cameras:
    source: fl511            # adapters/water/fl511_cameras.py
    counties: ["Miami-Dade", "Miami Dade"]
  noaa_tide:
    station: "8723214"       # Virginia Key, FL
    datum: MLLW
    # NOAA flood levels are published in station datum (STND); MLLW = 10.13 ft STND.
    # NWS minor 13.66 / moderate 14.06 / major 14.86 ft STND  ->  MLLW below.
    watch_ft: 3.0
    minor_flood_ft: 3.53
    moderate_flood_ft: 3.93
    major_flood_ft: 4.73
  usgs:
    county_cd: "12086"
    parameter_cd: "00065"    # gauge height, ft
    rapid_rise_ft_3h: 0.5    # generic watch rule: rise faster than this over 3 h
    site_thresholds: {}      # optional {site_no: {watch: x, alert: y}}

air:
  airnow: {distance_miles: 25}
  purpleair: {max_sensors: 60}
  aqi_watch: 101
  aqi_alert: 151
  nhc_radius_km: 800         # storm center within 800 km -> watch
  nhc_alert_radius_km: 300   # within 300 km -> alert

land:
  fema: {state: FL, fips_county: "086", lookback_days: 365}
  earthquakes: {min_magnitude: 2.5, lookback_days: 30}
  evac_zones:
    zones_layer: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/HurricaneEvacZone_gdb/FeatureServer/0
    orders_layer: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/EvacuationOrder/FeatureServer/0
    shelters_layer: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/EvacuationCenterShelters_Open/FeatureServer/0
    info_url: https://www.miamidade.gov/global/emergency/hurricane/home.page
    # Order flags are shown as 'watch - confirm with official channels' unless true.
    trust_orders: false

  # Reference sites from Miami-Dade County Open Data (ArcGIS Hub). Shown on the map, never change a tile status.
  county_gis:
    - id: mdc_evac_bus_pickup
      name: Hurricane evacuation bus pickup point
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Hurricane_Bus_Stops/FeatureServer/0
      fields: FACILITY,ADDRESS,CITY,EVACZONE,ACTIVE
      label_field: FACILITY
      measurement: evacuation_bus_pickup
      link: https://www.miamidade.gov/global/emergency/hurricane/home.page
    - id: mdc_hospitals
      name: Hospital
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Miami_Dade_Hospitals/FeatureServer/0
      fields: NAME,ADDRESS,CITY,BED,PHONE
      label_field: NAME
      measurement: hospital

fire:
  nws_station: KMIA          # Miami International Airport
  heat_index_watch_f: 103
  heat_index_alert_f: 108
  firms:
    sources: [VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT, VIIRS_SNPP_NRT, MODIS_NRT]
    days: 2                  # FIRMS area API allows 1-10
    # wider than the city bbox: includes the Everglades edge where most local fires start
    bbox: {south: 25.13, north: 25.98, west: -81.00, east: -80.11}
  hotspots:                  # per-neighborhood rule for satellite detections (forces/fire.py)
    min_confidence: nominal  # low | nominal | high
    alert_km: 5
    watch_km: 15
  context:                   # shown on the Hazard Board fire tile; never a status
    stations_layer: mdc_fire_stations
    cooling_layer: mdc_cooling_centers
    cooling_count: 2
  # DEMO_MODE=1 only: clearly labelled SIMULATED hotspot(s) for a dry-day demo (demo/demo_mode.py)
  demo_hotspots:
    - {name: "Everglades edge west of Doral (Krome Ave)", lat: 25.795, lon: -80.445, frp: 18.5, confidence: nominal}
  county_gis:
    - id: mdc_fire_stations
      name: Fire station (Miami-Dade Fire Rescue)
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/FireStation_gdb/FeatureServer/0
      fields: NAME,ADDRESS,CITY,TYPE
      label_field: NAME
      measurement: fire_station
    - id: mdc_cooling_centers
      name: Cooling center (extreme heat)
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Cooling_Centers/FeatureServer/0
      fields: Name,Street,City_1,Type,OperationalHours,PhoneNumbe
      label_field: Name
      measurement: cooling_center

# Public open-data portal (ArcGIS Hub). Generic code in core/arcgis.py; any Hub city only edits this block.
open_data:
  portal: https://gis-mdc.opendata.arcgis.com/
  attribution: Miami-Dade County Open Data
  # Map overlays served at /api/overlays/<id> (GeoJSON, cached 6 h). simplify = maxAllowableOffset in degrees.
  overlays:
    - id: mdc_surge_zones
      name: Storm surge planning / evacuation zones A-E
      force: land
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/StormSurgePlanningZone_Multipart/FeatureServer/0
      where: "ZONEID <> 'N'"
      fields: ZONEID
      label_field: ZONEID
      simplify: 0.0005
      style_field: ZONEID
      styles: {A: "#dc2626", B: "#f97316", C: "#facc15", D: "#22c55e", E: "#3b82f6"}
      default: true
    - id: mdc_evac_routes
      name: Primary evacuation routes
      force: land
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/PrimaryEvacuationRoute_gdb/FeatureServer/0
      fields: SN
      label_field: SN
      simplify: 0.0005
      color: "#e879f9"
    - id: mdc_fema_ve
      name: FEMA flood zone VE (coastal high hazard)
      force: water
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/FEMAFloodZone_VEView/FeatureServer/0
      fields: FZONE,ELEV
      label_field: FZONE
      simplify: 0.0005
      page_size: 100          # this layer's maxRecordCount
      color: "#0ea5e9"
    - id: mdc_fema_ae
      name: FEMA flood zone AE (1% annual chance)
      force: water
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/FEMAFloodZone_AEView/FeatureServer/0
      fields: FZONE,ELEV
      label_field: FZONE
      simplify: 0.001
      page_size: 100
      color: "#38bdf8"
    - id: mdc_canals
      name: Canals
      force: water
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Canal_gdb/FeatureServer/0
      fields: NAME,TYPE,MAINTBY
      label_field: NAME
      simplify: 0.0005
      color: "#22d3ee"
    - id: mdc_heat_islands
      name: Urban heat island effect by census tract (deg F)
      force: fire
      url: https://services.arcgis.com/8Pc9XBTAsYuxx9Ny/arcgis/rest/services/Urban_Heat_Islands/FeatureServer/0
      fields: urban_heat_island_effect_F,TRACT_FIPS,POPULATION
      label_field: urban_heat_island_effect_F
      simplify: 0.0005
      style_field: urban_heat_island_effect_F
      ramp: [[0, "#fde68a"], [8, "#fb923c"], [10, "#ef4444"], [12, "#991b1b"]]

nws:
  point: [25.77, -80.19]
  zones: [FLZ073, FLZ074, FLZ173, FLZ174, FLC086]

# Hazard Board tiles (approximate centroids + NWS forecast zone from api.weather.gov/zones?point=)
neighborhoods:
  - {id: downtown,      name: Downtown / Brickell, lat: 25.7617, lon: -80.1918, zone: FLZ173}
  - {id: miami-beach,   name: Miami Beach,         lat: 25.7907, lon: -80.1300, zone: FLZ173}
  - {id: little-havana, name: Little Havana,       lat: 25.7735, lon: -80.2163, zone: FLZ074}
  - {id: little-haiti,  name: Little Haiti,        lat: 25.8303, lon: -80.1956, zone: FLZ173}
  - {id: north-miami,   name: North Miami,         lat: 25.8901, lon: -80.1867, zone: FLZ173}
  - {id: hialeah,       name: Hialeah,             lat: 25.8576, lon: -80.2781, zone: FLZ074}
  - {id: doral,         name: Doral,               lat: 25.8195, lon: -80.3553, zone: FLZ074}
  - {id: coral-gables,  name: Coral Gables,        lat: 25.7215, lon: -80.2684, zone: FLZ074}
  - {id: key-biscayne,  name: Key Biscayne,        lat: 25.6937, lon: -80.1626, zone: FLZ173}
  - {id: homestead,     name: Homestead,           lat: 25.4687, lon: -80.4776, zone: FLZ073}

coastal_zones: [FLZ173, FLZ174]   # tide gauge readings apply to these zones
nearby_km: 6                      # point observations within this distance count for a tile
languages: [en, es, ht]
